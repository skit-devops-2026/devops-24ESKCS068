global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "student-management-system"
    metrics_path: "/stub_status"
    scrape_interval: 10s
    static_configs:
      - targets: ["web:80"]
        labels:
          app: "student-management-system"
          env: "production"

  - job_name: "prometheus"
    scrape_interval: 15s
    static_configs:
      - targets: ["localhost:9090"]
