apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-management-system
  labels:
    app: student-management-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: student-management-system
  template:
    metadata:
      labels:
        app: student-management-system
    spec:
      containers:
        - name: student-management-system
          image: ghcr.io/aryansharma68/student-management-system-2:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 3
