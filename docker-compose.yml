services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/aryansharma68/student-management-system-2:latest
    container_name: student-management-app
    restart: unless-stopped
    ports:
      - "8000:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - app-net

  prometheus:
    image: prom/prometheus:latest
    container_name: student-management-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    depends_on:
      web:
        condition: service_healthy
    networks:
      - app-net

  grafana:
    image: grafana/grafana:latest
    container_name: student-management-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana-provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/dashboard.json:/var/lib/grafana/dashboards/dashboard.json:ro
    depends_on:
      - prometheus
    networks:
      - app-net

networks:
  app-net:
    driver: bridge
